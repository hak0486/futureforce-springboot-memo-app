<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>

<body>
	<h1 class="app-title">サインアップ</h1>
	<form id="contact-form" th:action="@{/admin/signup}" th:object="${admin}" method="post" novalidate>
		<div class="form-grid">
			<div class="form-group">
    			<input type="text" id="last_name"  name="lastName" placeholder="姓" required>
				<div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-message"></div>
 
	   			<input type="text" id="first_name"  name="firstName" placeholder="名" required>
				<div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-message"></div>
				
    			<input type="email" id="email"  name="email" placeholder="メールアドレス" required>
				<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></div>

    			<input type="password" id="password"  name="password" placeholder="パスワード" required>
				<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></div>
				
    			<button type='submit' class="btn btn-primary">サインアップ</button>
			</div>
		</div>
	</form>
	<a th:href="@{/admin/signin}" class="btn btn-primary">サインイン</a>
	<script th:src="@{/js/common.js}"></script>
</body>

</html>
